name: Робот ЕИС
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Опросить ЕИС
        run: python eis_fetch.py
      - name: Сохранить результат
        run: |
          git config user.name "datum-robot"
          git config user.email "robot@datum.local"
          git add data/tenders.json
          git diff --cached --quiet || git commit -m "ЕИС: обновление закупок $(date -u +'%Y-%m-%d %H:%M')"
          git push
