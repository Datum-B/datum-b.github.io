<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DATUM · первый вход</title>
<!-- шрифт не блокирует показ страницы: если Google недоступен, работает системный -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<!-- библиотеки лежат на этом же сайте — никаких внешних сетей -->
<script defer src="jszip.min.js"></script>
<script defer src="pdf.min.js"></script>
<script defer src="xlsx.full.min.js"></script>
<style>
/* ═══ DATUM · токены бренда (светлая тема — основная) ═══ */
:root{
  --ink:#0B0D10;--ink-700:#2A323C;--ink-500:#5A6675;--ink-300:#A3AEBB;--ink-200:#CBD3DC;
  --line:#E4E9EF;--bg:#FFFFFF;--surface:#F4F6F9;--surface-2:#FAFBFC;
  --o50:#FBF3E9;--o100:#F4E3CC;--o300:#DBA765;--o500:#B9762B;--o600:#9A5F1F;--o700:#7C4A16;
  --ok:#046C4E;--ok-50:#F0FBF6;--warn:#92400E;--warn-500:#D97706;--warn-50:#FFFBEB;--danger:#B91C1C;--danger-50:#FEF2F2;
  --shadow:0 10px 30px -18px rgba(11,13,16,.28);
  --r:12px;--r-sm:8px;--r-lg:18px;
  --accent:var(--o700);--btn:var(--o600);
  color-scheme:light;
}
html.dark{
  --ink:#F4F6F9;--ink-700:#CBD3DC;--ink-500:#A3AEBB;--ink-300:#7A8797;--ink-200:#3D4753;
  --line:#2A323C;--bg:#0B0D10;--surface:#14181D;--surface-2:#171C22;
  --o50:#241A0E;--o100:#3E240A;--accent:#DBA765;--btn:#B9762B;
  --ok:#3DD598;--ok-50:#12271F;--warn:#F0A45C;--warn-500:#D97706;--warn-50:#2A1E12;--danger:#F87171;--danger-50:#2C1618;
  --shadow:0 20px 48px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--o100);color:var(--ink)}
:focus-visible{outline:2px solid var(--o500);outline-offset:2px}

.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);font-weight:700}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
.lede{color:var(--ink-500);max-width:66ch}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s cubic-bezier(.2,.7,.3,1) both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live{animation:pulse 1.1s infinite}

/* поверхности */
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.box.soft{background:var(--surface)}
.box-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.box-h .t{font-weight:700;font-size:15px}
.box-h .s{font-size:13px;color:var(--ink-500);margin-top:3px}
.rec{border-left:3px solid var(--o500);background:var(--o50);padding:16px 20px;border-radius:0 10px 10px 0}
.rec .eyebrow{color:var(--o700)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--line);color:var(--ink-500);background:var(--bg)}
.chip.ok{color:var(--ok);border-color:#B9E6D3;background:var(--ok-50)}
.chip.warn{color:var(--warn);border-color:#F3D9A6;background:var(--warn-50)}
.chip.bad{color:var(--danger);border-color:#F5C2C2;background:var(--danger-50)}
.chip.brand{color:var(--o700);border-color:#EBD9BE;background:var(--o50)}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--bg);transition:.15s;white-space:nowrap}
.btn:hover{background:var(--surface)}
.btn.pri{background:var(--btn);color:#fff;border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{font-size:13px;padding:7px 12px;border-radius:8px}
.btn.ghost{border-color:transparent;color:var(--ink-500)}
.btn.ghost:hover{color:var(--ink);background:var(--surface)}
.btn:disabled{opacity:.45;pointer-events:none}
input,select{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:14px;transition:.15s;width:100%}
input:focus,select:focus{outline:none;border-color:var(--o500);box-shadow:0 0 0 3px var(--o100)}
input::placeholder{color:var(--ink-300)}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--o500);transition:width .5s}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);font-weight:700;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;gap:10px;align-items:center;padding:12px 18px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:var(--shadow);animation:rise .3s both}
html.dark .toast{background:#F4F6F9;color:#0B0D10}

/* вход */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth .left{padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);background:var(--surface)}
.auth .right{display:flex;align-items:center;justify-content:center;padding:32px}
.mark{display:flex;align-items:center;gap:11px}
.mark b{font-weight:700;letter-spacing:.16em;font-size:14px}
.hero h1{font-size:clamp(34px,4vw,50px);max-width:12ch}
.hero p{margin-top:20px;font-size:16px;color:var(--ink-500);max-width:52ch;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:34px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);max-width:600px}
.kpis div{background:var(--bg);padding:16px 18px}
.kpis b{font-size:28px;font-weight:800;letter-spacing:-.03em;display:block}
.kpis span{font-size:12.5px;color:var(--ink-500);display:block;margin-top:4px}

/* мастер */
.wiz{max-width:900px;margin:0 auto;padding:28px 20px 70px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.step{flex:1;min-width:150px;display:flex;gap:10px;align-items:center;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink-500);font-size:12.5px}
.step.on{border-color:var(--o500);color:var(--ink);background:var(--o50)}
.step.ok{color:var(--ink-500)}
.step .n{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);flex:none;background:var(--bg)}
.step.on .n{background:var(--o600);color:#fff;border-color:transparent}
.step.ok .n{background:var(--ok);color:#fff;border-color:transparent}
.card{border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;background:var(--bg)}
.drop{border:1.5px dashed var(--ink-200);border-radius:var(--r);background:var(--surface);padding:30px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--o500);background:var(--o50)}
.field{display:grid;gap:7px}
.row3{display:grid;grid-template-columns:190px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.row3 input{height:34px;font-size:13.5px}
.check{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;transition:.15s}
.check:hover{border-color:var(--ink-200)}
.check.done{opacity:.55}
.tick{width:20px;height:20px;border-radius:99px;border:1.5px solid var(--ink-200);flex:none;display:grid;place-items:center;font-size:11px;color:transparent}
.check.done .tick{background:var(--ok);border-color:transparent;color:#fff}
.busy{display:flex;gap:12px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:14px;font-size:14px}

/* приложение */
.shell{display:flex;min-height:100vh}
.rail{width:236px;flex:none;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line)}
.rail-top{height:60px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line)}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 11px;border-radius:8px;font-size:14px;color:var(--ink-500);cursor:pointer}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--bg);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(11,13,16,.06)}
.nav a .ic{width:16px;text-align:center;font-size:13px;opacity:.8}
.rail-foot{padding:12px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.main{flex:1;min-width:0}
.topbar{padding:22px 30px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;background:var(--bg)}
.topbar .sub{font-size:14px;color:var(--ink-500);margin-top:6px}
.page{padding:24px 30px 60px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.stat{padding:18px 20px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.stat .d{margin-top:8px;font-size:12.5px;color:var(--ink-500);display:flex;gap:6px;flex-wrap:wrap}
.empty{max-width:640px;margin:26px auto;padding:38px;text-align:center}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth .left{display:none}.rail{display:none}.g2{grid-template-columns:1fr}.row3{grid-template-columns:1fr;gap:6px}.page{padding:16px}.topbar{padding:16px}}
@media(max-width:600px){.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
window.addEventListener('error',function(e){
  var a=document.getElementById('app');
  if(a&&!a.innerHTML.trim())a.innerHTML='<div style="max-width:620px;margin:12vh auto;padding:28px;border:1px solid #E4E9EF;border-radius:14px;font-family:Inter,sans-serif"><b>Страница не запустилась.</b><p style="margin-top:8px;color:#5A6675">Обновите страницу. Если повторится — покажите текст ниже разработчику.</p><pre style="margin-top:12px;font-size:12px;white-space:pre-wrap;color:#5A6675">'+(e.message||e)+'</pre></div>';
});
window.addEventListener('DOMContentLoaded',function(){if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';}});
</script>
<script>
/* ═══ DATUM · первый вход. Файлы читаются в браузере и никуда не отправляются. ═══ */
const TODAY=(d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()))(new Date());
const dt=o=>new Date(TODAY.getTime()+o*864e5).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
const m=n=>{const a=Math.abs(n||0);if(a>=1e6)return (n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:1})+' млн ₽';if(a>=1e3)return Math.round(n/1e3).toLocaleString('ru-RU')+' тыс ₽';return Math.round(n||0).toLocaleString('ru-RU')+' ₽'};
const rub=n=>(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽';
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const el=()=>document.getElementById('app');
const MARK=(sz=22,ink='currentColor',dot='#B9762B')=>`<svg viewBox="0 0 32 32" width="${sz}" height="${sz}" aria-label="DATUM"><path d="M6.4 8.8 L26 13.4 L14 26.8 Z" fill="none" stroke="${ink}" stroke-width="1.8" stroke-linejoin="round"/><g fill="${ink}"><circle cx="6.4" cy="8.8" r="2.3"/><circle cx="26" cy="13.4" r="2.3"/><circle cx="14" cy="26.8" r="2.3"/></g><circle cx="15.6" cy="16.2" r="3.4" fill="${dot}"/></svg>`;

const VERSION='0.1 · пилот';
let S={screen:'welcome',step:0,company:null,team:[],objects:[],estimates:[],docs:[],telegram:false,page:'dash',busy:null,err:null,key:null,synced:null,feedback:false,changelog:false,tenders:[],eis:null,eisErr:null,tq:'',tsearch:'',tview:'eis',schedule:null};

/* ═══ Сохранение: база страницы (общая для всех, кто открыл ссылку) + запас в браузере ═══ */
let DB=null, CHANGELOG=null;
const SAVE_KEYS=['screen','step','company','team','objects','estimates','docs','telegram','page','tenders','schedule'];
function snapshot(){const o={};SAVE_KEYS.forEach(k=>o[k]=S[k]);o.updatedAt=new Date().toISOString();o.version=VERSION;return o}
async function persist(){if(!S.key)return;const data=snapshot();
  try{localStorage.setItem('datum:'+S.key,JSON.stringify(data));localStorage.setItem('datum:last',S.key)}catch(e){}
  if(DB){try{await DB.doc('companies/'+S.key).set(data);S.synced=new Date();paintSync()}catch(e){S.synced='err';paintSync()}}}
function paintSync(){const n=document.getElementById('sync');if(!n)return;
  n.textContent=S.synced==='err'?'не сохранилось в облако — есть копия на устройстве':S.synced?'сохранено '+S.synced.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):(DB?'облако подключено':'сохраняется на этом устройстве');
  n.style.color=S.synced==='err'?'var(--danger)':'var(--ink-300)'}
/* ═══ Перенос данных файлом — для работы без облака и для отправки разработчику ═══ */
function exportData(){if(!S.key){toast('Сначала войдите в компанию');return}
  const data=snapshot();data.key=S.key;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`datum-${S.key}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Файл с данными компании сохранён — его можно открыть на другом устройстве или отправить разработчику')}
function importData(){pickFiles(async files=>{const f=files[0];if(!f)return;
  try{const data=JSON.parse(await f.text());if(!data||!data.company)throw new Error('В файле нет данных компании');
    S.key=data.key||S.key||(data.company.inn||'').replace(/\D/g,'');SAVE_KEYS.forEach(k=>{if(data[k]!==undefined)S[k]=data[k]});
    if(S.screen==='welcome')S.screen='app';render();persist();toast('Данные загружены из файла')}
  catch(e){toast('Не удалось прочитать файл: '+(e.message||e))}},{accept:'.json'})}
async function loadCompany(key){key=String(key||'').replace(/\D/g,'');if(key.length<10){toast('Введите ИНН — 10 или 12 цифр');return}
  busy('Ищем данные компании…');let data=null;
  if(DB){try{const d=await DB.doc('companies/'+key).get();data=d&&(d.data?d.data():d)||null;if(data&&data.exists===false)data=null}catch(e){data=null}}
  if(!data){try{data=JSON.parse(localStorage.getItem('datum:'+key)||'null')}catch(e){}}
  S.key=key;
  if(data&&data.company){SAVE_KEYS.forEach(k=>{if(data[k]!==undefined)S[k]=data[k]});S.busy=null;S.screen=S.screen==='welcome'?'app':S.screen;render();toast('Данные компании загружены — продолжайте с того места, где остановились')}
  else{S.busy=null;S.screen='wizard';S.step=0;render();setTimeout(()=>{const i=document.getElementById('inn');if(i)i.value=key},0)}
  try{localStorage.setItem('datum:last',key)}catch(e){}}
(async()=>{try{if(window.claude&&claude.use){DB=await claude.use('db');if(DB){try{const c=await DB.doc('meta/changelog').get();const v=c&&(c.data?c.data():c);if(v&&v.items)CHANGELOG=v.items}catch(e){}}}}catch(e){DB=null}
  paintSync();
  /* один раз вошёл — дальше приложение открывается сразу на том же месте */
  try{const last=localStorage.getItem('datum:last');
    if(last&&S.screen==='welcome'){let data=null;
      try{data=JSON.parse(localStorage.getItem('datum:'+last)||'null')}catch(e){}
      if(!data&&DB){try{const d=await DB.doc('companies/'+last).get();data=d&&(d.data?d.data():d)||null;if(data&&data.exists===false)data=null}catch(e){}}
      if(data&&data.company){S.key=last;SAVE_KEYS.forEach(k=>{if(data[k]!==undefined)S[k]=data[k]});if(S.screen==='welcome')S.screen='app';render()}
      else{const i=document.getElementById('inn_gate');if(i)i.value=last}}}catch(e){}})();

let _saveT=null;
function render(){
  el().innerHTML=(S.screen==='welcome'?welcomeView():S.screen==='wizard'?wizardView():appView())+feedbackUI();
  paintSync();
  if(S.key&&S.screen!=='welcome'){clearTimeout(_saveT);_saveT=setTimeout(persist,400)}
}
window.addEventListener('beforeunload',()=>{if(S.key&&S.screen!=='welcome'){try{localStorage.setItem('datum:'+S.key,JSON.stringify(snapshot()));localStorage.setItem('datum:last',S.key)}catch(e){}}});
function toast(t){const p=document.querySelector('.toast');if(p)p.remove();const d=document.createElement('div');d.className='toast';d.innerHTML='<span style="color:#DBA765">●</span>'+t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function theme(){document.documentElement.classList.toggle('dark')}
function go(p){S.page=p;render();window.scrollTo(0,0)}
function busy(label){S.busy=label;S.err=null;render()}
function fail(msg){S.busy=null;S.err=msg;render()}
function done(){S.busy=null;S.err=null;render()}

/* ═══ Чтение файлов ═══ */
const ext=n=>(n.split('.').pop()||'').toLowerCase();
function docxXmlToText(xml){let t=xml.replace(/<w:tab\/>/g,'\t').replace(/<\/w:p>/g,'\n').replace(/<\/w:tc>/g,'\t').replace(/<[^>]+>/g,'');
  return t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#(\d+);/g,(x,n)=>String.fromCharCode(n)).replace(/ /g,' ')}
async function readDocx(file){if(!window.JSZip)throw new Error('Модуль чтения Word ещё загружается — подождите пару секунд и повторите');const zip=await JSZip.loadAsync(file);const f=zip.file('word/document.xml');if(!f)throw new Error('Это не документ Word');return docxXmlToText(await f.async('string'))}
async function readDocxTables(file){if(!window.JSZip)throw new Error('Модуль чтения Word ещё загружается — подождите пару секунд и повторите');const zip=await JSZip.loadAsync(file);const xml=await zip.file('word/document.xml').async('string');const rows=[];
  for(const tr of xml.match(/<w:tr[ >][\s\S]*?<\/w:tr>/g)||[]){const cells=(tr.match(/<w:tc[ >][\s\S]*?<\/w:tc>/g)||[]).map(c=>docxXmlToText(c).replace(/\s+/g,' ').trim());if(cells.some(Boolean))rows.push(cells)}
  return rows}
async function readPdf(file){if(!window.pdfjsLib)throw new Error('Модуль чтения PDF ещё загружается — подождите пару секунд и повторите');
  const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let out='';
  for(let i=1;i<=Math.min(pdf.numPages,40);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();out+=c.items.map(x=>x.str).join(' ')+'\n'}
  return {text:out,pages:pdf.numPages}}
async function readXlsx(file){if(!window.XLSX)throw new Error('Модуль чтения Excel ещё загружается — подождите пару секунд и повторите');const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).map(r=>r.map(c=>String(c).trim()))}
async function readText(file){const e=ext(file.name);

/* ═══ Разбор контракта ═══ */
const num=s=>parseFloat(String(s).replace(/[\s ]/g,'').replace(',','.'));
function parseContract(raw){
  const t=raw.replace(/ /g,' ').replace(/[ \t]+/g,' ');
  const pick=(re,i=1)=>{const x=t.match(re);return x?x[i].replace(/\s+/g,' ').trim():null};
  const f={};
  f.number=pick(/(?:контракт|договор)[а-яё]*\s*№\s*([A-Za-zА-Яа-я0-9\-\/_.]+)/i);
  f.customer=pick(/((?:Государственн|Муниципальн|Федеральн|Санкт|СПб|ГБ|МБ|ФГ|Администрац)[^\n]{5,260}?)\s*,?\s*(?:именуем[а-яё]+ в дальнейшем|далее)\s*[«"]?Заказчик/i)||pick(/Заказчик\s*[:\-—]\s*([^\n]{5,200})/i);
  f.contractor=pick(/((?:ООО|АО|ПАО|ИП)\s*[«"][^»"]+[»"][^\n]{0,160}?)\s*,?\s*(?:именуем[а-яё]+ в дальнейшем|далее)\s*[«"]?Подрядчик/i)||pick(/Подрядчик\s*[:\-—]\s*([^\n]{5,160})/i);
  f.inn=pick(/ИНН\s*[:№]?\s*(\d{10}|\d{12})/i);
  const price=pick(/(?:цена|стоимость)\s+(?:контракта|договора)\s+(?:составляет|равна)?\s*([\d][\d\s]*[.,]\d{2})/i)||pick(/составляет\s*([\d][\d\s]*[.,]\d{2})\s*(?:руб|₽)/i);
  f.price=price?num(price):null;
  f.address=pick(/по адресу\s*:?\s*([^\n;]{8,200}?)(?:[,;.]\s*(?:контракт|далее|именуем|в лице|лит)|\n|$)/i);
  const per=t.match(/с\s*(\d{2}\.\d{2}\.\d{4})\s*(?:г\.?\s*)?по\s*(\d{2}\.\d{2}\.\d{4})/i);
  f.start=per?per[1]:null;f.end=per?per[2]:null;
  if(!f.end){const x=t.match(/(?:срок|окончани)[^\n]{0,80}?(\d{2}\.\d{2}\.\d{4})/i);if(x)f.end=x[1]}
  const dur=pick(/(\d+)\s*\([^)]*\)\s*(?:календарн|рабоч)[а-яё]+\s*дн/i)||pick(/(\d+)\s*(?:календарн|рабоч)[а-яё]+\s*дн/i);
  f.duration=dur?+dur:null;
  f.advance=/аванс/i.test(t)?(/аванс[а-яё]*\s+не\s+(?:предусм|выплач)/i.test(t)?'не предусмотрен':'предусмотрен'):null;
  const pay=pick(/в течение\s*(\d+)\s*(?:\([^)]*\)\s*)?(?:рабочих|календарных)?\s*дн[а-яё]*[^\n]{0,60}?(?:подписан|приём|прием)/i);
  f.payTerm=pay?+pay:null;
  f.penalty=/1\/300/.test(t)?'1/300 ключевой ставки ЦБ РФ за день просрочки':(/(?:пен[яи]|неустойк)/i.test(t)?'предусмотрена (раздел об ответственности)':null);
  f.control=pick(/строительн[а-яё]+ контрол[а-яё]*[^\n]{0,60}?((?:СПб|ГБУ|ГКУ|ООО|АО)[^\n.;]{5,120})/i);
  f.law=/44-ФЗ|44 ФЗ/.test(t)?'44-ФЗ':(/223-ФЗ/.test(t)?'223-ФЗ':null);
  f.subject=pick(/(?:предмет[а-яё]*\s+(?:контракта|договора)|выполнение работ по)\s*[:\-—]?\s*([^\n.;]{8,140})/i);
  f.chars=t.length;
  return f;
}

/* ═══ Разбор сметы ═══ */
/* ═══ Локальный сметный расчёт (SmetaWIZARD, ГрандСмета): позиции = строки с № п.п., сумма = «Всего по позиции» ═══ */
function parseLSR(rows){
  const clean=v=>String(v==null?'':v).replace(/[\s ]/g,'').replace(',','.');
  const toNum=v=>{const c=clean(v);return /^-?\d+(\.\d+)?$/.test(c)?parseFloat(c):null};
  let hdr=-1,cN=2,cU=3,cQ=4;
  for(let i=0;i<Math.min(rows.length,120);i++){const h=(rows[i]||[]).map(c=>String(c).toLowerCase());
    const iO=h.findIndex(c=>/обоснован/.test(c)),iN=h.findIndex(c=>/наимен.*(работ|затрат)/.test(c));
    if(iO>=0&&iN>=0){hdr=i;cN=iN;cU=h.findIndex(c=>/единиц/.test(c));cQ=h.findIndex(c=>/количеств/.test(c));if(cU<0)cU=iN+1;if(cQ<0)cQ=iN+2;break}}
  if(hdr<0)return null;
  const lastNum=r=>{for(let k=r.length-1;k>=0;k--){const n=toNum(r[k]);if(n!=null)return n}return null};
  const items=[],sections=[],extras=[];let cur=null,section='',subtotal=null,vat=null,vatNote='',grand=null,afterTotal=false;
  const isHeader=r=>{const h=(r||[]).map(c=>String(c).toLowerCase());return h.some(c=>/обоснован/.test(c))&&h.some(c=>/наимен/.test(c))};
  for(let i=hdr+1;i<rows.length;i++){const r=rows[i]||[];const c0=String(r[0]||'').trim();const name=String(r[cN]||'').trim();
    /* вторая таблица (другой лист: материалы, ресурсы) — не часть расчёта */
    if(isHeader(r)&&items.length&&afterTotal)break;
    if(isHeader(r)&&items.length&&/^(ИТОГО|Итого)/.test(String((rows[i-1]||[])[cN]||(rows[i-2]||[])[cN]||''))){break}
    const secM=c0.match(/^Раздел\s*(\d+)\.?\s*(.*)$/i);
    if(secM){section=(secM[2]||'').replace(/[<>]/g,'').trim()||('Раздел '+secM[1]);sections.push(section);cur=null;continue}
    if(r.length<=2&&c0&&toNum(c0)==null&&!/^(итого|всего|составил|проверил|\(|справочно)/i.test(c0)){section=c0;sections.push(section);continue}
    if(/^\d+$/.test(c0)&&name&&toNum(name)==null){if(afterTotal&&+c0===1&&items.length>1)break;cur={num:+c0,section,code:String(r[1]||'').trim(),name:name.replace(/V=.*$/,'').replace(/\s+/g,' ').trim().slice(0,160),unit:String(r[cU]||'').trim()||'—',qty:toNum(r[cQ]),sum:lastNum(r)};items.push(cur);continue}
    if(/^Всего по позиции/i.test(name)&&cur){const n=lastNum(r);if(n!=null)cur.sum=n;continue}
    if(/^(ВСЕГО по смете|Итого по разделам|ИТОГО по позициям|ИТОГО без НДС)/i.test(name)){const n=lastNum(r);if(n!=null)subtotal=n;afterTotal=true;continue}
    if(!afterTotal)continue;
    if(/^НДС/i.test(name)){const n=lastNum(r);if(n!=null&&!/не облагается/i.test(name))vat=n;else vatNote=name.replace(/\s+/g,' ').slice(0,80);continue}
    if(/^(Итого|ВСЕГО)/i.test(name)){const n=lastNum(r);if(n!=null)grand=n;continue}
    if(/^(Прогнозный|Индекс|Коэффициент|Временн|Зимн|Непредвид|Лимитир)/i.test(name)){const n=lastNum(r);if(n!=null&&n!==0&&!/^(Всего|в том числе)/i.test(name))extras.push({name:name.replace(/\s+/g,' ').slice(0,90),sum:n})}}
  const good=items.filter(it=>it.sum!=null&&it.sum>0);if(good.length<2)return null;
  const posSum=good.reduce((a,b)=>a+b.sum,0);
  const extrasSum=extras.reduce((a,b)=>a+b.sum,0);
  const total=grand!=null?grand:(subtotal!=null?subtotal:posSum)+(grand==null?0:0);
  const expected=posSum+extrasSum+(vat||0);
  return {kind:'lsr',items:good,sections:[...new Set(sections)],posSum,subtotal,extras,vat,vatNote,total,
    consistent:Math.abs(total-expected)<1||Math.abs((subtotal!=null?subtotal:posSum)-posSum)<1&&grand==null,header:true};
}
function parseEstimate(rows){
  const isNum=v=>{const s=String(v).replace(/[\s ]/g,'');return s!==''&&/^-?\d+([.,]\d+)?$/.test(s)};
  let hdr=-1,col={};
  for(let i=0;i<Math.min(rows.length,80);i++){const h=rows[i].map(c=>c.toLowerCase());
    const iN=h.findIndex(c=>/наимен/.test(c)),iU=h.findIndex(c=>/^ед|единиц/.test(c)),iQ=h.findIndex(c=>/кол/.test(c)),iS=h.findIndex(c=>/сумм|стоим|всего|итого/.test(c));
    if(iN>=0&&(iQ>=0||iS>=0)){hdr=i;col={n:iN,u:iU,q:iQ,s:iS};break}}
  const items=[];
  for(let i=hdr>=0?hdr+1:0;i<rows.length;i++){const r=rows[i];if(!r||r.length<2)continue;
    let name,unit,qty,sum;
    if(hdr>=0){name=r[col.n];unit=col.u>=0?r[col.u]:'';qty=col.q>=0?r[col.q]:'';const nums=r.filter(isNum);sum=(col.s>=0&&isNum(r[col.s]))?r[col.s]:(nums.length?nums[nums.length-1]:'')}
    else{const texts=r.filter(c=>c&&!isNum(c)),nums=r.filter(isNum);name=[...texts].sort((a,b)=>b.length-a.length)[0];unit=texts.find(c=>/^(м|м2|м²|м3|шт|кг|т|л|компл|100 )/i.test(c))||'';qty=nums.length>1?nums[0]:'';sum=nums.length?nums[nums.length-1]:''}
    if(!name||name.length<4||!isNum(sum))continue;
    if(/^(итого|всего|в том числе|фот|нр |сп |накладн|сметн|ндс)/i.test(name.trim()))continue;
    const s=num(sum);if(!(s>0))continue;
    items.push({name:name.replace(/\s+/g,' ').trim().slice(0,140),unit:unit||'—',qty:isNum(qty)?num(qty):null,sum:s})}
  return {items:items.slice(0,400),total:items.reduce((a,b)=>a+b.sum,0),header:hdr>=0};
}

  [/доп[.\s]*соглаш|дс\s*№/i,'Доп. соглашение'],[/контракт|договор/i,'Контракт'],[/смет|лср|вор|ведомост/i,'Смета и объёмы'],[/календарн|график/i,'План работ'],
  [/акт/i,'Акт'],[/журнал/i,'Журнал'],[/приказ/i,'Приказ'],[/сертиф|паспорт|деклар/i,'Сертификаты и паспорта'],[/письм|уведомл|согласован/i,'Переписка'],[/охран|инструктаж|пожарн/i,'Охрана труда']];
function classify(name){const e=ext(name);if(['jpg','jpeg','png','heic','webp'].includes(e))return ['Фотофиксация',true];for(const [re,k] of RULES)if(re.test(name))return [k,true];return ['Прочее',false]}

/** Папка объекта целиком: находим контракт, смету и остальные документы за один раз. */
async function onObjectFiles(files){
  files=[...files].filter(f=>f&&f.name&&!f.name.startsWith('.'));
  if(!files.length)return;
  busy(`Разбираем ${files.length} ${plural(files.length,'файл','файла','файлов')}: ищем контракт, смету и документы…`);
  try{
    const textual=files.filter(f=>['pdf','docx','txt'].includes(ext(f.name)));
    // кандидаты на контракт: сначала по названию, потом остальные текстовые
    const byName=textual.filter(f=>/контракт|договор/i.test(f.name)&&!/доп|соглаш|проект/i.test(f.name));
    const cands=[...byName,...textual.filter(f=>!byName.includes(f))].slice(0,6);
    let best=null;
    for(const f of cands){
      try{const {text,pages}=await readText(f);
        if(!text||text.replace(/\s/g,'').length<200)continue;
        const p=parseContract(text);
        const score=['number','customer','price','end','payTerm','subject'].filter(k=>p[k]).length;
        if(!best||score>best.score)best={f,p,pages,score};
        if(score>=5)break;
      }catch(e){/* нечитаемый файл пропускаем */}
    }
    // смета: xlsx/docx с подходящим названием, иначе любой xlsx
    const smetaCands=[...files.filter(f=>/смет|лср|вор|ведомост/i.test(f.name)&&['xlsx','xls','xlsm','csv','docx'].includes(ext(f.name))),
                      ...files.filter(f=>['xlsx','xls','xlsm','csv'].includes(ext(f.name)))];
    let est=null;const found=[];
    for(const f of [...new Set(smetaCands)].slice(0,8)){
      try{const rows=['docx'].includes(ext(f.name))?await readDocxTables(f):await readXlsx(f);
        const r=parseLSR(rows)||parseEstimate(rows);
        if(r.items.length>=3)found.push({file:f.name,items:r.items,total:r.total,header:r.header,kind:r.kind||'table',posSum:r.posSum,subtotal:r.subtotal,extras:r.extras,vat:r.vat,vatNote:r.vatNote,consistent:r.consistent,sections:r.sections});
      }catch(e){}
    }
    /* настоящий сметный расчёт важнее любой таблицы (ВОР, спецификации) */
    est=found.find(x=>x.kind==='lsr')||found.sort((a,b)=>b.items.length-a.items.length)[0]||null;
    // все файлы — в документы объекта
    S.docs=files.slice(0,300).map(f=>{const [kind,sure]=classify(f.name);return {name:f.name,size:f.size,kind,sure,obj:'',date:f.lastModified?new Date(f.lastModified).toLocaleDateString('ru-RU'):'—'}});
    if(est)S.estimates=[est];
    if(best){const p=best.p;
      S.objects=[{file:best.f.name,pages:best.pages,fields:p,code:'',bundle:files.length,
        number:p.number||'',customer:p.customer||'',contractor:p.contractor||'',subject:p.subject||'',address:p.address||'',
        price:p.price,start:p.start||'',end:p.end||'',advance:p.advance||'',payTerm:p.payTerm,penalty:p.penalty||'',control:p.control||'',law:p.law||''}];
      done();toast(`Контракт найден в «${esc(best.f.name)}»${est?', смета прочитана':''}, документов: ${S.docs.length}`);
    }else{
      // контракт не нашли — объект всё равно создаём, поля заполнит человек
      S.objects=[{file:files.length===1?files[0].name:`${files.length} файлов, контракт не найден`,pages:null,fields:null,code:'',bundle:files.length,
        number:'',customer:'',contractor:S.company?S.company.name:'',subject:'',address:'',price:null,start:'',end:'',advance:'',payTerm:null,penalty:'',control:'',law:''}];
      done();toast(textual.length?'В файлах не нашёл текста контракта — заполните поля вручную, документы приложены':'Текстовых файлов нет — приложил как документы, поля заполните вручную');
    }
  }catch(e){fail(e.message||String(e))}
}

/** Дозагрузка к уже созданному объекту: новые файлы уходят в документы, смета подхватывается, поля контракта не трогаем. */
async function onObjectFilesMore(files){
  files=[...files].filter(f=>f&&f.name&&!f.name.startsWith('.'));if(!files.length)return;
  busy(`Добавляем ${files.length} ${plural(files.length,'файл','файла','файлов')}…`);
  try{
    const code=S.objects[0]?S.objects[0].code:'';
    const have=new Set(S.docs.map(d=>d.name));
    files.forEach(f=>{if(have.has(f.name))return;const [kind,sure]=classify(f.name);
      S.docs.push({name:f.name,size:f.size,kind,sure,obj:code,date:f.lastModified?new Date(f.lastModified).toLocaleDateString('ru-RU'):'—'})});
    if(!S.estimates.length){
      for(const f of files.filter(f=>['xlsx','xls','xlsm','csv','docx'].includes(ext(f.name)))){
        try{const rows=ext(f.name)==='docx'?await readDocxTables(f):await readXlsx(f);const r=parseLSR(rows)||parseEstimate(rows);
          if(r.items.length>=3){S.estimates=[{file:f.name,items:r.items,total:r.total,header:r.header,kind:r.kind||'table',posSum:r.posSum,subtotal:r.subtotal,extras:r.extras,vat:r.vat,vatNote:r.vatNote,consistent:r.consistent,sections:r.sections}];break}}catch(e){}
      }
    }
    if(S.objects[0])S.objects[0].bundle=S.docs.length;
    done();toast(`Добавлено. Документов по объекту: ${S.docs.length}`);
  }catch(e){fail(e.message||String(e))}
}

/* ═══ Автозаполнение по ИНН: ЕГРЮЛ через DaData (ключ лежит в data/config.json) ═══ */
let CFG=null;
async function loadCfg(){if(CFG)return CFG;try{const r=await fetch('data/config.json?'+Date.now(),{cache:'no-store'});CFG=r.ok?await r.json():{}}catch(e){CFG={}}return CFG}
async function registryLookup(inn){
  const cfg=await loadCfg();if(!cfg.dadataToken)return {status:'nokey'};
  try{const r=await fetch('https://suggestions.dadata.ru/suggestions/api/4_1/rs/findById/party',{method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json','Authorization':'Token '+cfg.dadataToken},body:JSON.stringify({query:inn,branch_type:'MAIN'})});
    if(r.status===403){return {status:'badkey'}}
    if(!r.ok)return {status:'error',message:'HTTP '+r.status};
    const j=await r.json();const it=(j.suggestions||[])[0];if(!it)return {status:'notfound'};
    const d=it.data||{};const addr=d.address||{};const ad=addr.data||{};const mg=d.management||{};
    const taxMap={USN:'УСН',ENVD:'ЕНВД',ESHN:'ЕСХН',PSN:'Патент'};
    const tax=(d.finance&&d.finance.tax_system)?(taxMap[d.finance.tax_system]||d.finance.tax_system):'';
    return {status:'ok',company:{inn,fromRegistry:true,
      name:(d.name&&(d.name.short_with_opf||d.name.full_with_opf))||it.value||'',
      ogrn:d.ogrn||'',kpp:d.kpp||'',
      addr:addr.unrestricted_value||addr.value||'',
      head:[mg.post,mg.name].filter(Boolean).join(' '),
      tax:tax,okved:d.okved||'',state:(d.state&&d.state.status)||'',
      region:ad.region_with_type||ad.city||'',registered:d.state&&d.state.registration_date?new Date(d.state.registration_date).toLocaleDateString('ru-RU'):''}}}
  catch(e){return {status:'error',message:e.message||String(e)}}
}
async function lookupInn(){const inn=((document.getElementById('inn')||{}).value||'').replace(/\D/g,'');
  if(inn.length<10){toast('ИНН — 10 или 12 цифр');return}
  if(!S.key)S.key=inn;try{localStorage.setItem('datum:last',S.key)}catch(e){}
  const keep=S.company||{};const own={spec:keep.spec||'',cap:keep.cap||'',crew:keep.crew||''};
  if(inn==='7817145422'){busy('Подставляем реквизиты…');setTimeout(()=>{S.company=Object.assign({inn,fromRegistry:true,name:'ООО «СК ГОРИЗОНТ-А»',ogrn:'1257800032995',kpp:'781701001',addr:'196624, Санкт-Петербург, пос. Шушары, 2-й Бадаевский проезд, д. 3, корп. 1, лит. А, офис 312',head:'Генеральный директор Аракелян Мисак Айказович',tax:'УСН 15 % — НДС не облагается',spec:'ремонт, отделочные работы, кровля, инженерные сети',region:'Санкт-Петербург',cap:'25 000 000 ₽',crew:'8'},own.spec?own:{});done()},700);return}
  busy('Ищем компанию в ЕГРЮЛ…');
  const res=await registryLookup(inn);
  const blank={inn,fromRegistry:false,name:'',ogrn:'',kpp:'',addr:'',head:'',tax:'',spec:'',region:'',cap:'',crew:''};
  if(res.status==='ok'){S.company=Object.assign(blank,keep,res.company,own);done();
    toast('Реквизиты подставлены из ЕГРЮЛ'+(res.company.state&&res.company.state!=='ACTIVE'?' — внимание: статус компании «'+res.company.state+'»':'')+'. Осталось заполнить профиль работ');return}
  S.company=Object.assign(blank,keep,{inn});done();
  const why={nokey:'Автозаполнение по ИНН ещё не подключено (нужен ключ ЕГРЮЛ-сервиса) — заполните реквизиты один раз вручную',
    badkey:'Ключ ЕГРЮЛ-сервиса не принят — сообщите разработчику. Пока заполните реквизиты вручную',
    notfound:'Компания с таким ИНН в ЕГРЮЛ не найдена — проверьте ИНН или заполните вручную',
    error:'ЕГРЮЛ-сервис не ответил ('+(res.message||'')+') — заполните реквизиты вручную'};
  toast(why[res.status]||why.error)}

/* ═══ График работ: строится из контракта, дальше корректируется руками; каждая правка — в журнале ═══ */
const ISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromISO=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const ruD=s=>{const d=fromISO(s);return d?d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'};
const pdRu=s=>{const x=String(s||'').match(/(\d{2})\.(\d{2})\.(\d{4})/);return x?new Date(+x[3],+x[2]-1,+x[1]):null};
function buildSchedule(o){
  const names=['Подготовка объекта','Демонтажные работы','Черновая отделка','Инженерные сети','Чистовая отделка','Сдача и приёмка'];
  const a=pdRu(o.start)||new Date(TODAY.getTime()-20*864e5),b=pdRu(o.end)||new Date(a.getTime()+42*864e5);
  const days=Math.max(names.length,Math.round((b-a)/864e5));const span=days/names.length;
  return {obj:o.code||'',contractEnd:ISO(b),stages:names.map((n,i)=>{const f=new Date(a.getTime()+Math.round(span*i)*864e5),t=new Date(a.getTime()+(i===names.length-1?days:Math.round(span*(i+1))-1)*864e5);return {id:'s'+(i+1),name:n,start:ISO(f),end:ISO(t),done:0,note:''}}),log:[{at:ISO(TODAY),text:'График построен из срока контракта '+(o.start||'')+' — '+(o.end||'')}]};
}
function ensureSchedule(){const o=S.objects[0];if(!o)return null;if(!S.schedule||S.schedule.obj!==(o.code||''))S.schedule=buildSchedule(o);return S.schedule}
function schedLog(text){const sc=S.schedule;sc.log.unshift({at:ISO(TODAY),text});sc.log=sc.log.slice(0,30)}
function schedUpd(id,field,value){const sc=S.schedule;const st=sc.stages.find(x=>x.id===id);if(!st)return;const old=st[field];
  if(field==='done'){value=Math.max(0,Math.min(100,parseInt(value,10)||0))}
  if((field==='start'||field==='end')&&!fromISO(value)){toast('Дата не распознана');render();return}
  if(field==='start'&&fromISO(value)>fromISO(st.end)){st.end=value}
  if(field==='end'&&fromISO(value)<fromISO(st.start)){st.start=value}
  if(String(old)===String(value))return;st[field]=value;
  const lbl={name:'название',start:'начало',end:'окончание',done:'выполнение',note:'заметка'}[field];
  schedLog(`«${st.name}»: ${lbl} ${field==='start'||field==='end'?ruD(old)+' → '+ruD(value):field==='done'?old+'% → '+value+'%':field==='note'?'изменена':'«'+old+'» → «'+value+'»'}`);
  render();toast('Сохранено')}
function schedAdd(){const sc=S.schedule;const last=sc.stages[sc.stages.length-1];const f=last?fromISO(last.end):TODAY;const st={id:'s'+Date.now(),name:'Новый этап',start:ISO(new Date(f.getTime()+864e5)),end:ISO(new Date(f.getTime()+7*864e5)),done:0,note:''};sc.stages.push(st);schedLog('Добавлен этап «Новый этап»');render();setTimeout(()=>{const i=document.getElementById('sn_'+st.id);if(i){i.focus();i.select()}},0)}
function schedDel(id){const sc=S.schedule;const st=sc.stages.find(x=>x.id===id);if(!st)return;if(sc.stages.length<=1){toast('Последний этап удалить нельзя');return}sc.stages=sc.stages.filter(x=>x.id!==id);schedLog('Удалён этап «'+st.name+'»');render()}
function schedMove(id,dir){const sc=S.schedule;const i=sc.stages.findIndex(x=>x.id===id);const j=i+dir;if(i<0||j<0||j>=sc.stages.length)return;[sc.stages[i],sc.stages[j]]=[sc.stages[j],sc.stages[i]];render()}
function schedShift(){const n=parseInt((document.getElementById('sh_days')||{}).value,10);if(!n){toast('Укажите, на сколько дней сдвинуть');return}
  S.schedule.stages.forEach(st=>{if(st.done>=100)return;st.start=ISO(new Date(fromISO(st.start).getTime()+n*864e5));st.end=ISO(new Date(fromISO(st.end).getTime()+n*864e5))});
  schedLog(`Все незавершённые этапы сдвинуты на ${n>0?'+':''}${n} дн.`);render();toast('График сдвинут')}
function schedReset(){if(!confirm('Перестроить график из срока контракта? Ваши правки будут потеряны.'))return;const o=S.objects[0];S.schedule=buildSchedule(o);schedLog('График перестроен по контракту');render()}
function pSchedule(){const o=S.objects[0];if(!o)return head('Производство','График работ','Появится вместе с объектом')+`<div class="page">${empty('График строится из контракта','Как только появится объект, система разложит срок на этапы и построит календарный график по дням. Дальше сроки правятся прямо в таблице.','Завести объект',"S.screen='wizard';S.step=2;render()")}</div>`;
  const sc=ensureSchedule();const st=sc.stages;
  const off=d=>Math.round((d-TODAY)/864e5);
  const starts=st.map(x=>fromISO(x.start)).filter(Boolean),ends=st.map(x=>fromISO(x.end)).filter(Boolean);
  const s0=Math.min(...starts.map(off),0)-3,s1=Math.max(...ends.map(off),0)+3;
  const W=760,L=210,x=d=>L+((d-s0)/(s1-s0))*(W-L-14);

  return head('Производство','График работ',`${esc(o.code)} · ${st.length} ${plural(st.length,'этап','этапа','этапов')} · выполнено ${prog}% · срок по контракту ${ruD(sc.contractEnd)}`,

  ${late.length?`<div class="rec" style="margin-bottom:14px;border-left-color:var(--warn);background:var(--warn-50)"><b>${late.length} ${plural(late.length,'этап просрочен','этапа просрочены','этапов просрочены')}:</b> ${late.map(x=>esc(x.name)+' (до '+ruD(x.end)+', выполнено '+x.done+'%)').join('; ')}. Поправьте сроки или отметьте выполнение.</div>`:''}
  <div class="box rise"><div class="box-h"><div><div class="t">Календарный график</div><div class="s">Серым — план, охрой — выполнение. Даты и проценты правятся в таблице ниже</div></div></div>
  <div style="padding:20px;overflow-x:auto"><svg width="100%" viewBox="0 0 ${W} ${st.length*36+48}" style="display:block;min-width:600px">${st.map((n,i)=>{const y=22+i*36,f=off(fromISO(n.start)),t=off(fromISO(n.end))+1;const isLate=fromISO(n.end)<TODAY&&n.done<100;
      return `<text x="0" y="${y+12}" font-size="12" fill="var(--ink-500)" font-weight="600">${String(i+1).padStart(2,'0')}</text><text x="26" y="${y+12}" font-size="12.5" fill="var(--ink)">${esc(n.name).slice(0,28)}</text><text x="0" y="${y+26}" font-size="10" fill="${isLate?'var(--danger)':'var(--ink-300)'}">${ruD(n.start)} — ${ruD(n.end)} · ${n.done}%</text>${bar(x(f),x(t),y,16,'var(--surface)',isLate?'var(--danger)':'var(--line)')}${n.done>0?bar(x(f),x(f)+(x(t)-x(f))*n.done/100,y,16,'var(--o300)'):''}`}).join('')}<line x1="${x(0)}" x2="${x(0)}" y1="8" y2="${st.length*36+20}" stroke="var(--o500)" stroke-width="1.5"/><text x="${x(0)+6}" y="${st.length*36+40}" font-size="10" fill="var(--o700)" font-weight="700" letter-spacing="1.5">СЕГОДНЯ</text>${cEnd?`<line x1="${x(off(cEnd)+1)}" x2="${x(off(cEnd)+1)}" y1="8" y2="${st.length*36+20}" stroke="var(--danger)" stroke-width="1" stroke-dasharray="3 3"/><text x="${x(off(cEnd)+1)-4}" y="${st.length*36+40}" text-anchor="end" font-size="10" fill="var(--danger)" font-weight="700" letter-spacing="1.5">СРОК КОНТРАКТА</text>`:''}</svg></div></div>
  <div class="box rise" style="margin-top:14px"><div class="box-h"><div><div class="t">Этапы</div><div class="s">Измените дату, процент или название — график перестроится, правка попадёт в журнал</div></div>

async function loadEis(force){

    S.eis=await r.json();S.eisErr=null}
  catch(e){S.eisErr='Не удалось загрузить данные ЕИС: '+(e.message||e);if(!S.eis)S.eis={status:'error',tenders:[],searches:[]}}

const numRu=v=>v==null?'—':Number(v).toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽';
function grade(t){
  /* Оценка 0–100 по профилю компании: понятная, без «магии» */
  const c=S.company||{};const f=[];
  const spec=(c.spec||'').toLowerCase().split(/[,;]/).map(x=>x.trim()).filter(Boolean);
  const title=(t.title||'').toLowerCase();
  const hit=spec.filter(w=>w&&title.includes(w.split(' ')[0]));
  f.push(['Профиль работ',hit.length?100:35,hit.length?'совпадает: '+hit.join(', '):'вне основной специализации',.3]);
  const region=(c.region||'').toLowerCase();
  const rhit=region&&((t.customer||'')+' '+(t.raw||'')).toLowerCase().includes(region.split(' ')[0].replace('санкт-петербург','петербург'));
  f.push(['География',rhit?100:45,rhit?'домашний регион':'регион не подтверждён',.15]);
  const cap=parseFloat(String(c.cap||'').replace(/[^\d]/g,''))||0;
  const price=t.price||0;
  const sz=!price?60:!cap?60:price<=cap?100:Math.max(0,100-Math.round((price-cap)/cap*120));
  f.push(['Размер контракта',sz,price?numRu(price)+(cap&&price>cap?' — выше вашего потолка':''):'цена не указана',.25]);
  const dl=t.deadline?Math.round((parseRu(t.deadline)-Date.now())/864e5):null;
  const dlp=dl==null?60:dl<0?0:Math.min(100,dl*12+10);
  f.push(['Время на подготовку',dlp,dl==null?'срок подачи не указан':dl<0?'подача закрыта':dl+' дн. до подачи',.15]);
  f.push(['Тип закупки',/аукцион/i.test(t.method||'')?80:65,t.method||'способ не указан',.15]);
  const sw=f.reduce((a,x)=>a+x[3],0);const total=Math.round(f.reduce((a,x)=>a+x[1]*x[3],0)/sw);
  return {total,verdict:total>=70?'GO':total>=45?'REVIEW':'NO_GO',factors:f,daysLeft:dl};
}

async function sendFeedback(){
  const text=(document.getElementById('fb_text').value||'').trim();if(!text){toast('Напишите хотя бы пару слов');return}
  const rec={company:S.key,companyName:S.company?S.company.name:null,where:document.getElementById('fb_where').value,who:document.getElementById('fb_who').value,text,version:VERSION,ua:navigator.userAgent.slice(0,120),at:new Date().toISOString()};
  const id='fb_'+Date.now();
  let ok=false;if(DB){try{await DB.doc('feedback/'+id).set(rec);ok=true}catch(e){}}
  try{const arr=JSON.parse(localStorage.getItem('datum:feedback')||'[]');arr.push(rec);localStorage.setItem('datum:feedback',JSON.stringify(arr))}catch(e){}
  S.feedback=false;render();
  if(ok){toast('Спасибо — сообщение ушло разработчику');return}
  // без облака — отправляем через Telegram: текст уже готов, остаётся выбрать чат
  const msg=`DATUM ${VERSION} · ${rec.where}\n${rec.companyName||'компания '+(rec.company||'')}\n\n${text}${rec.who?'\n\nСвязь: '+rec.who:''}`;
  try{await navigator.clipboard.writeText(msg)}catch(e){}
  window.open('https://t.me/share/url?url='+encodeURIComponent(location.href.split('#')[0])+'&text='+encodeURIComponent(msg),'_blank');
  toast('Сообщение скопировано и открыт Telegram — выберите чат, куда отправить')}

/* сохранять после каждого значимого действия */
['saveCompany','addMember','saveObject','finishWizard','skipStep','connectTelegram','contractSample','estimateSample','docsSample','manualObject','lookupInn'].forEach(name=>{const f=window[name];if(typeof f==='function')window[name]=function(){const r=f.apply(this,arguments);Promise.resolve(r).then(()=>persist());return r}});
const _go=go;go=function(p){_go(p);persist()};
const _onObjectFiles=onObjectFiles;onObjectFiles=async function(files){await _onObjectFiles(files);persist()};
const _onObjectFilesMore=onObjectFilesMore;onObjectFilesMore=async function(files){await _onObjectFilesMore(files);persist()};
const _onEstimateFiles=onEstimateFiles;onEstimateFiles=async function(files){await _onEstimateFiles(files);persist()};
const _onDocFiles=onDocFiles;onDocFiles=function(files){_onDocFiles(files);setTimeout(persist,900)};
render();
</script>
